name: CI AND TESTS

on:
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MovieTracker.Tests/MovieTracker.Tests.csproj

      - name: Check Code Style (dotnet format)
        if: matrix.os == 'windows-latest'
        run: dotnet format MovieTracker.Tests --no-restore --verify-no-changes

      - name: Build
        run: dotnet build MovieTracker.Tests/MovieTracker.Tests.csproj --configuration Release --no-restore

      - name: Run Tests
        if: matrix.os != 'ubuntu-latest'
        run: dotnet test --project MovieTracker.Tests/MovieTracker.Tests.csproj --configuration Release --no-build
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          Jwt__Key: "IfthisworkworkIwillgencry6767yayhappyhappy"
          Jwt__Issuer: "TestIssuer"
          Jwt__Audience: "TestAudience"

      - name: Run Tests with Coverage
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet test --project MovieTracker.Tests/MovieTracker.Tests.csproj
          --configuration Release --no-build
          --coverage
          --coverage-output-format cobertura
          --coverage-output coverage.cobertura.xml
          --coverage-settings coverage.config
          --results-directory ./TestResults
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          Jwt__Key: "IfthisworkworkIwillgencry6767yayhappyhappy"
          Jwt__Issuer: "TestIssuer"
          Jwt__Audience: "TestAudience"

      - name: Generate Coverage Report
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -assemblyfilters:"+MovieTracker.*;-MovieTracker.Tests" \
            -reporttypes:"Html;MarkdownSummaryGithub;TextSummary"
          cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          cat coverage-report/Summary.txt

      - name: Upload Coverage Report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/