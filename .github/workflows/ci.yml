
name: CI AND TESTS

on:
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MovieTracker.Tests/MovieTracker.Tests.csproj

      - name: Build
        run: dotnet build MovieTracker.Tests/MovieTracker.Tests.csproj --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test --project MovieTracker.Tests/MovieTracker.Tests.csproj --configuration Release --no-build
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          Jwt__Key: "IfthisworkworkIwillgencry6767yayhappyhappy"
          Jwt__Issuer: "TestIssuer"
          Jwt__Audience: "TestAudience"
